<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anirudh Singh — Full Stack Developer</title>
    <meta name="description" content="Anirudh Singh — Full Stack Developer working with the MERN stack and Java. Portfolio, projects, skills and contact." />
    <meta property="og:title" content="Anirudh Singh — Full Stack Developer" />
    <meta property="og:description" content="MERN stack & Java. Scalable web apps, API integrations, AWS Lambda automation." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@500;700;800;900&family=Unbounded:wght@600;800&display=swap" />
    <script>
      // Apply the saved theme/style before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('as-theme'); if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
          var s = localStorage.getItem('as-style'); if (s && s !== 'glass') document.documentElement.setAttribute('data-style', s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
